<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Table Rase">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Table Rase</title>
<style>
:root{--bg:#eef0fb;--sf:#fff;--ink:#1b1f4b;--mut:#5d6290;--ac:#4f46d8;--acink:#fff;--hot:#e5482b;--ok:#0f9d74;--ln:#d3d7f0;--s1:#b9c5ff;--s2:#eef0ff;--h1:#aab4ee;--h2:#8f9be0;--gd:#6a74c4;--tr:#2b2f66;--fb:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d24;--sf:#161a45;--ink:#eceeff;--mut:#9aa0d6;--ac:#8f86ff;--acink:#0b0d24;--hot:#ff7a5c;--ok:#3ee0b0;--ln:#2a2f68;--s1:#0b0d24;--s2:#232a73;--h1:#1a1f55;--h2:#262d7a;--gd:#141845;--tr:#070816}}
:root[data-theme="dark"]{--bg:#0b0d24;--sf:#161a45;--ink:#eceeff;--mut:#9aa0d6;--ac:#8f86ff;--acink:#0b0d24;--hot:#ff7a5c;--ok:#3ee0b0;--ln:#2a2f68;--s1:#0b0d24;--s2:#232a73;--h1:#1a1f55;--h2:#262d7a;--gd:#141845;--tr:#070816}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:500 16px/1.4 var(--fb);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#g{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
#hud{display:flex;align-items:center;gap:14px;padding:8px 14px;font-weight:700}
#hud .l{font-size:11px;font-weight:500;color:var(--mut);display:block;text-transform:uppercase;letter-spacing:.08em}
#hud b{font-size:21px;line-height:1.1}
#hud .sp{flex:1}
#hp{color:var(--hot);letter-spacing:2px}
.ib{width:40px;height:40px;border-radius:12px;background:var(--sf);border:1px solid var(--ln);font-size:17px}
#cvw{flex:1;position:relative;min-height:0;border-radius:18px;margin:0 8px;overflow:hidden;border:1px solid var(--ln)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(6px)}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:22px 18px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(20,20,70,.25);max-height:100%;overflow:auto}
.panel h1{font-size:42px;line-height:1;margin:0 0 8px;letter-spacing:-.02em}
.panel h2{font-size:28px;margin:0 0 8px}
.panel p{margin:6px 0;color:var(--mut)}
.btn{display:block;width:100%;background:var(--ac);color:var(--acink);font-weight:700;font-size:19px;padding:13px;border-radius:14px;margin-top:10px}
.btn.s{background:var(--bg);color:var(--ink);border:1px solid var(--ln)}
.modes{display:flex;gap:10px;margin:14px 0}
.mode{flex:1;padding:10px 8px;border-radius:14px;border:2px solid var(--ln);font-size:14px;line-height:1.2}
.mode b{font-size:26px}
.mode[aria-pressed=true]{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.big{font-size:54px;font-weight:700;line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.grid div{background:var(--bg);border-radius:12px;padding:8px 4px;font-size:13px;color:var(--mut)}
.grid b{font-size:20px;color:var(--ink)}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.cell{border-radius:10px;padding:6px 2px;line-height:1.1}
.cell b{font-size:18px;display:block}
.cell small{font-size:11px;opacity:.85}
.m0{background:var(--bg)}
.m1{background:color-mix(in srgb,var(--hot) 35%,var(--sf))}
.m2{background:color-mix(in srgb,#e8a317 40%,var(--sf))}
.m3{background:color-mix(in srgb,var(--ok) 40%,var(--sf))}
.lst{text-align:left;font-size:14px;color:var(--ink);margin:8px 0}
.lst p{color:var(--ink);margin:3px 0}
.lg{font-size:12px}
#bar{display:flex;gap:8px;padding:10px 12px 4px;align-items:center}
#ans{flex:1;height:54px;border-radius:14px;background:var(--sf);border:2px solid var(--ln);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:32px;letter-spacing:.06em}
#ans.bad{animation:sk .3s;border-color:var(--hot)}
@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){#ans.bad{animation:none}}
.fire{height:54px;padding:0 22px;background:var(--hot);color:#fff;border-radius:14px;font-weight:700;font-size:18px}
.del{width:54px;height:54px;border-radius:14px;background:var(--sf);border:1px solid var(--ln);font-size:22px}
#pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:4px 12px 12px}
#pad button{height:46px;border-radius:12px;background:var(--sf);border:1px solid var(--ln);font-weight:700;font-size:20px}
#pad button:active{background:var(--ac);color:var(--acink)}
@media(hover:hover) and (pointer:fine){#pad{display:none}#bar{padding-bottom:14px}}
</style>
</head>
<body>
<div id="g">
  <div id="hud">
    <div><span class="l">Score</span><b id="sc">0</b></div>
    <div><span class="l">Niveau</span><b id="lv">1</b></div>
    <span class="sp"></span>
    <b id="hp" aria-label="Blindage"></b>
    <button class="ib" data-a="snd" id="sb" aria-label="Son">🔊</button>
    <button class="ib" data-a="pause" aria-label="Pause">⏸</button>
  </div>
  <div id="cvw"><canvas id="c" role="img" aria-label="Champ de bataille : ton char affronte un char ennemi qui affiche une multiplication à résoudre"></canvas><div id="ovr"></div></div>
  <div id="bar"><div id="ans" aria-live="polite"></div><button class="del" data-k="del" aria-label="Effacer">⌫</button><button class="fire" data-a="fire">Feu !</button></div>
  <div id="pad"></div>
</div>
<script>
const $=s=>document.querySelector(s),cv=$("#c"),cx=cv.getContext("2d");
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const RM=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
let W=0,H=0,DPR=1,u=40,gy=0,px=0,ex=0,C={};
let ph="menu",pt=0,paused=false,score=0,level=1,kills=0,armor=3,ans="",shots=0,okN=0;
let mode=ld("tr2:mode",10),best=ld("tr2:best",{10:0,20:0}),snd=ld("tr2:snd",1),ST=ld("tr2:stats",{});
let en=null,tl=0,tlMax=10,scroll=0,wreck=null,Sh=[],E=[],Pt=[],Sm=[],Db=[],F=[],flash=0,shake=0,rcP=0,rcE=0,wr=0,lastQ="",ac,rs=false,lt=0,Q=[],tm=0,master,rv,nb,eng,dk=false,lastTick=99,ps=0;

function theme(){const dd=document.documentElement.dataset.theme;dk=dd==="dark"||(dd!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);const s=getComputedStyle(document.documentElement),g=n=>s.getPropertyValue(n).trim();C={};["bg","sf","ink","ac","hot","ok","ln","mut","s1","s2","h1","h2","gd","tr"].forEach(k=>C[k]=g("--"+k))}
function size(){const r=cv.parentNode.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);u=Math.max(24,Math.min(W/8,H/5));gy=Math.round(H*.8);px=W*.22;ex=W*.78}
function A(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.85;const cp=ac.createDynamicsCompressor();master.connect(cp);cp.connect(ac.destination);
const n=ac.sampleRate*1.8|0,b=ac.createBuffer(2,n,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}
rv=ac.createConvolver();rv.buffer=b;const rg=ac.createGain();rg.gain.value=.35;rv.connect(rg);rg.connect(cp);
const m=ac.sampleRate*2|0;nb=ac.createBuffer(1,m,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<m;i++)d[i]=Math.random()*2-1;
const eg=ac.createGain();eg.gain.value=0;eg.connect(master);const o1=ac.createOscillator();o1.type="sawtooth";o1.frequency.value=38;const o2=ac.createOscillator();o2.type="square";o2.frequency.value=19;
const f1=ac.createBiquadFilter();f1.type="lowpass";f1.frequency.value=150;o1.connect(f1);o2.connect(f1);f1.connect(eg);
const ns=ac.createBufferSource();ns.buffer=nb;ns.loop=true;const f2=ac.createBiquadFilter();f2.type="bandpass";f2.frequency.value=800;f2.Q.value=1.2;const cg=ac.createGain();cg.gain.value=0;ns.connect(f2);f2.connect(cg);cg.connect(master);
const lf=ac.createOscillator();lf.type="square";lf.frequency.value=11;const lg=ac.createGain();lg.gain.value=0;lf.connect(lg);lg.connect(cg.gain);
[o1,o2,ns,lf].forEach(x=>x.start());eng={eg,o1,o2,f1,lg,lf}}
if(ac.state==="suspended")ac.resume();return true}catch(e){return false}}
function out(n,wet){n.connect(master);if(wet){const g=ac.createGain();g.gain.value=wet;n.connect(g);g.connect(rv)}}
function nz(d,ty,f1,f2,v,dl,wet){if(!snd||!A())return;const t=ac.currentTime+(dl||0),s=ac.createBufferSource();s.buffer=nb;s.loop=true;const f=ac.createBiquadFilter();f.type=ty;f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);out(g,wet);s.start(t,Math.random());s.stop(t+d+.05)}
function tn(ty,f1,f2,d,v,dl,wet){if(!snd||!A())return;const t=ac.currentTime+(dl||0),o=ac.createOscillator();o.type=ty;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(10,f2),t+d);const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);out(g,wet);o.start(t);o.stop(t+d+.05)}
const sClack=()=>{nz(.05,"bandpass",2600,1800,.5,0,.1);tn("square",150,90,.07,.12,.03,0)};
const sDry=()=>{nz(.04,"bandpass",2200,1500,.5,0,0);tn("square",170,110,.09,.12,0,0)};
function sCannon(v){nz(.1,"bandpass",4000,1200,.9*v,0,.5);nz(.7,"lowpass",1000,80,.9*v,0,.7);tn("sine",120,30,.4,1.1*v,0,.3)}
const sWhistle=(d,v)=>tn("sine",1700,800,d,.05*v,0,.2);
function sBoom(big){nz(1.6,"lowpass",1500,45,1.1,0,.8);nz(.3,"bandpass",2800,500,.6,0,.3);tn("sine",90,20,1,1.2,0,.3);for(let i=0;i<9;i++)nz(.03,"highpass",4500,3500,.05+.18*Math.random(),.25+Math.random()*1.1,.2);if(big){nz(1.2,"lowpass",1200,50,.8,.38,.8);tn("sine",70,20,.8,.9,.38,.3)}}
function sHit(){[1130,1780,2460,3300].forEach((f,i)=>tn("sine",f,f*.97,.55-i*.09,.2/(i+1),0,.25));nz(.09,"bandpass",3200,1800,.6,0,.1);sBoom(0)}
const sTick=()=>tn("square",900,800,.04,.05,0,0);
const sLvl=()=>{tn("triangle",523,523,.2,.12,0,.1);tn("triangle",784,784,.35,.12,.15,.1)};
function engCtl(){if(!eng||!ac)return;const on=snd&&!paused&&ph!=="menu"&&ph!=="over",sp=ph==="drive"?Math.sin(Math.PI*Math.min(1,pt/1.7)):0,t=ac.currentTime;
eng.eg.gain.setTargetAtTime(on?.09+.1*sp:0,t,.2);eng.o1.frequency.setTargetAtTime(36+sp*20,t,.2);eng.o2.frequency.setTargetAtTime(18+sp*10,t,.2);eng.f1.frequency.setTargetAtTime(130+sp*140,t,.2);eng.lf.frequency.setTargetAtTime(7+sp*9,t,.2);eng.lg.gain.setTargetAtTime(on?sp*.06:0,t,.1)}
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

/* ---------- statistiques ---------- */
function rec(a,b,ok,ms){const k=a+"x"+b,f=ST[k]||(ST[k]=[0,0,0]);if(ok){f[0]++;f[2]+=ms}else f[1]++;sv("tr2:stats",ST)}
const sec=ms=>(ms/1000).toFixed(1).replace(".",",");
function tstats(){const T=[];for(let a=1;a<=20;a++){let ok=0,ko=0,ms=0;for(let b=1;b<=10;b++){const f=ST[a+"x"+b];if(f){ok+=f[0];ko+=f[1];ms+=f[2]}}T.push({a,n:ok+ko,r:ok+ko?ok/(ok+ko):0,t:ok?ms/ok:0})}return T}
const lvl=t=>!t.n?"m0":t.r>=.9&&t.t<=5000?"m3":t.r>=.7?"m2":"m1";
function statsView(){const T=tstats(),rk=T.filter(t=>t.n>=5),b3=[...rk].sort((x,y)=>y.r-x.r||x.t-y.t).slice(0,3),w3=[...rk].sort((x,y)=>x.r-y.r||y.t-x.t).slice(0,3);
const fa=Object.entries(ST).filter(([k,f])=>f[0]+f[1]>=2).map(([k,f])=>({k:k.replace("x"," × "),r:f[0]/(f[0]+f[1]),t:f[2]/Math.max(1,f[0])})).filter(f=>f.r<1||f.t>5000).sort((x,y)=>x.r-y.r||y.t-x.t).slice(0,5);
ov(`<h2>Mes tables</h2><div class="cells">${T.map(t=>`<div class="cell ${lvl(t)}"><b>${t.a}</b><small>${t.n?Math.round(t.r*100)+" %":"–"}</small></div>`).join("")}</div>
<p class="lg">Vert : maîtrisée (≥ 90 % et moins de 5 s) · Orange : en progrès · Rouge : à travailler · Gris : pas encore jouée</p>
<div class="lst">${rk.length?`<p><b>Les mieux maîtrisées :</b> ${b3.map(t=>t.a).join(", ")}</p><p><b>À travailler :</b> ${w3.map(t=>t.a).join(", ")}</p>`:"<p>Joue quelques duels : le classement apparaît après 5 réponses par table.</p>"}
${fa.length?`<p><b>Calculs à revoir :</b></p>${fa.map(f=>`<p>${f.k} · ${Math.round(f.r*100)} % · ${sec(f.t)} s</p>`).join("")}`:""}</div>
<button class="btn" data-a="menu">Retour</button><button class="btn s" data-a="reset">${rs?"Confirmer l’effacement":"Réinitialiser les stats"}</button>`)}
function pick(){let tot=0,L=[];for(let a=1;a<=mode;a++)for(let b=1;b<=10;b++){if(a+"x"+b===lastQ)continue;const f=ST[a+"x"+b],w=f?1+3*f[1]/(f[0]+f[1])+(f[2]/Math.max(1,f[0])>6000?1:0):2;L.push([a,b,w]);tot+=w}
let r=Math.random()*tot;for(const[x,y,w]of L){r-=w;if(r<=0)return[x,y]}return[L[0][0],L[0][1]]}

/* ---------- écrans ---------- */
function ov(h){$("#ovr").innerHTML=h?`<div class="ov"><div class="panel">${h}</div></div>`:""}
function menu(){ph="menu";paused=false;rs=false;en=null;wreck=null;Sh=[];ov(`<h1>Table Rase</h1><p>Un char ennemi te barre la route. Résous son calcul avant qu’il ne tire !</p>
<div class="modes"><button class="mode" data-a="mode" data-n="10" aria-pressed="${mode===10}">Tables<br><b>1 à 10</b></button><button class="mode" data-a="mode" data-n="20" aria-pressed="${mode===20}">Tables<br><b>1 à 20</b></button></div>
<button class="btn" data-a="play">Jouer</button><button class="btn s" data-a="stats">Mes tables</button><p>Record : ${best[mode]||0} pts</p>`)}
function over(){ph="over";const nr=score>(best[mode]||0);if(nr){best[mode]=score;sv("tr2:best",best)}
const w=tstats().filter(t=>t.n>=3).sort((x,y)=>x.r-y.r).slice(0,3).filter(t=>t.r<.9).map(t=>t.a);
ov(`<h2>${nr?"Nouveau record !":"Char détruit"}</h2><div class="big">${score}</div><div class="grid"><div><b>${kills}</b><br>chars détruits</div><div><b>${level}</b><br>niveau</div><div><b>${shots?Math.round(okN/shots*100):0} %</b><br>précision</div></div>${w.length?`<p><b>À revoir :</b> table${w.length>1?"s":""} de ${w.join(", ")}</p>`:""}<button class="btn" data-a="play">Rejouer</button><button class="btn s" data-a="stats">Mes tables</button><button class="btn s" data-a="menu">Menu</button>`)}
function pause(){if(ph==="menu"||ph==="over")return;if(paused)return resume();paused=true;ov(`<h2>Pause</h2><button class="btn" data-a="resume">Reprendre</button><button class="btn s" data-a="menu">Quitter</button>`)}
function resume(){paused=false;ov("");lt=performance.now()}
function hud(){$("#sc").textContent=score;$("#lv").textContent=level;$("#hp").textContent="♥".repeat(Math.max(0,armor))+"♡".repeat(Math.max(0,3-armor));$("#sb").textContent=snd?"🔊":"🔇"}
function upd(){$("#ans").textContent=ans}

/* ---------- partie ---------- */
function start(){score=0;level=1;kills=0;armor=3;shots=0;okN=0;ans="";en=null;wreck=null;Sh=[];E=[];Pt=[];Sm=[];Db=[];F=[];flash=0;shake=0;lastQ="";paused=false;ph="drive";pt=0;Q=[];ps=scroll;A();ov("");size();upd();hud();lt=performance.now()}
function startEnemy(){const[a,b]=pick();lastQ=a+"x"+b;en={a,b,ans:a*b,sw:Math.random()<.5,x:W+2.5*u,el:0,dead:0};ph="arrive";pt=0}
const TIPX=1.64,TIPY=1.12;
function shell(f){const p=f==="p",x0=p?px+TIPX*u:en.x-TIPX*u,y0=gy-TIPY*u,x1=p?en.x:px;Sh.push({x0,y0,x1,y1:gy-.8*u,k:0,d:p?.7:.9,f,tr:[],x:x0,y:y0,ang:0});muzzle(x0,y0,p?1:-1);sCannon(p?1:.7);sWhistle(p?.7:.9,p?.7:1)}
function muzzle(x,y,d){for(let i=0;i<8;i++)Sm.push({x:x+d*i*.05*u,y:y+(Math.random()-.5)*.1*u,vx:d*(40+Math.random()*60),vy:-10-Math.random()*20,r:.12*u,l:1.1,m:1.1,c:"#d4d2c8"});for(let i=0;i<7;i++)Sm.push({x:x-d*.9*u+(Math.random()-.5)*u,y:gy-3,vx:-d*(20+Math.random()*60),vy:-10-Math.random()*20,r:.1*u,l:.9,m:.9,c:"#b09a6e"})}
function shootP(){ph="load";pt=0;sClack()}
function enemyFire(){ans="";upd();ph="eshot";pt=0;rcE=1;shell("e")}
function fire(){if(ph!=="duel"||ans==="")return;const v=+ans;ans="";upd();shots++;
if(v===en.ans){okN++;rec(en.a,en.b,1,en.el*1000);shootP()}
else{rec(en.a,en.b,0,0);tl=Math.max(.6,tl-1.5);shake=.25;sDry();const e=$("#ans");e.classList.remove("bad");void e.offsetWidth;e.classList.add("bad");F.push({x:en.x,y:gy-3.6*u,t:"Raté ! −1,5 s",l:.9,c:C.hot,s:.4*u})}}
function impact(s){const x=s.x1;
if(s.f==="p"){boom(x,gy-.85*u,1.3);Db.push(deb(en.x,gy-1.25*u,-1,"e"));en.dead=1;kills++;const pts=100+Math.round(Math.max(0,tl)/tlMax*100);score+=pts;F.push({x:W/2,y:H*.3,t:"+"+pts,l:1.3,c:C.ok,s:.9*u});ph="boom";pt=0;shake=.55;flash=.28;sHit();vib(40);
 Q.push({t:.35,fn:()=>{if(en){boom(en.x,gy-1.1*u,1.1);shake=.4;sBoom(1)}}})}
else{boom(x,gy-.85*u,1);armor--;shake=.5;flash=.35;vib(150);sHit();lastTick=99;
